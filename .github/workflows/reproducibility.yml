name: Reproducibility

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Validate and reproduce tracked artifacts
        run: python src/verify_artifacts.py --manuscript main/arxiv24.tex --regenerate --run-validation

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned artifact container
        run: docker build --tag post-semcom-artifact:${{ github.sha }} .
      - name: Reproduce inside the container
        run: docker run --rm post-semcom-artifact:${{ github.sha }}

  manuscript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-publishers
      - name: Build arxiv24 master
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error arxiv.tex
          sha256sum arxiv.pdf > arxiv.pdf.sha256
      - name: Preserve PDF and checksum
        uses: actions/upload-artifact@v4
        with:
          name: arxiv24-pdf-${{ github.sha }}
          path: |
            arxiv.pdf
            arxiv.pdf.sha256
