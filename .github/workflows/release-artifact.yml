name: Publish fixed artifact release

on:
  push:
    tags:
      - "arxiv24-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-publishers
      - name: Validate fixed tag and tracked artifacts
        run: python src/verify_artifacts.py --regenerate --run-validation --expected-tag "${GITHUB_REF_NAME}"
      - name: Build deterministic release archive
        run: python src/package_release.py --source-revision "${GITHUB_SHA}" --output-dir dist
      - name: Build and hash manuscript PDF
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error arxiv.tex
          sha256sum arxiv.pdf > arxiv.pdf.sha256
      - name: Publish archive and SHA-256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* arxiv.pdf arxiv.pdf.sha256 --title "${GITHUB_REF_NAME}" --generate-notes
